[profile.default]
src = "contracts"
test = "test"
script = "scripts/foundry"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# The deployed v1 Leaderboard.sol (pragma =0.8.20) is kept for reference and not built here.
skip = ["contracts/Leaderboard.sol"]

[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"

[etherscan]
# Etherscan API v2 (one key works for Basescan / chain 8453). Use a NEW key; the old Basescan key leaked.
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
